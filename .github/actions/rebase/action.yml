name: "Rebase onto the PR event base"
description: "Test the head against the base revision captured by the same PR event."

inputs:
  base-sha:
    description: "Full base commit SHA from the pull request event"
    required: true

runs:
  using: "composite"

  steps:
    - name: Rebase onto the recorded base SHA
      shell: bash
      env:
        PR_BASE_SHA: ${{ inputs.base-sha }}
        GIT_COMMITTER_EMAIL: wavelength-ci@example.com
        GIT_COMMITTER_NAME: Wavelength CI
      run: |
        if ! [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Missing or invalid pull request base SHA" >&2
          exit 1
        fi
        if ! git cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null; then
          git fetch --no-tags origin "$PR_BASE_SHA"
        fi
        git rebase "$PR_BASE_SHA"
