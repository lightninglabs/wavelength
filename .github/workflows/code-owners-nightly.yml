name: Code Owners Nightly

# Refreshes .github/code-owners.json, the ownership map the issue-assign
# workflow reads to route incoming issues.
#
# It measures THIS repository only, and publishes the result. A repo is
# the only place that can authoritatively answer who works on its code,
# and having a sibling compute the answer would need a cross-repo token to
# do something this repo can do for itself.
#
# lumos runs the same script and merges this file in, because issues are
# filed there that track work here -- it fetches the published map rather
# than cloning and recomputing.
#
# The map is also an artifact in its own right: its diff shows ownership
# moving between people over time, and a wrong answer can be argued with
# in a PR rather than rediscovered inside a prompt.
#
# Opens a PR rather than pushing to master. Ownership drifts slowly, so
# most nights produce no diff and no PR.

on:
  schedule:
    # 03:42 UTC, deliberately off the hour (GitHub flags the top of the
    # hour as a high-load window where scheduled runs get delayed or
    # dropped) and an hour AHEAD of lumos's 04:42 run, which fetches the
    # map this job publishes. Running after it would hand lumos a map a
    # day old every night.
    - cron: '42 3 * * *'
  workflow_dispatch:

concurrency:
  group: code-owners-nightly
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  MAP_PATH: .github/code-owners.json
  # The branch this job pushes to. It must never be a protected branch:
  # this workflow proposes a change and a human merges it, always.
  #
  # The push below refuses to run if this names one, so relaxing the rule
  # takes more than editing this line. That guard is not defending against
  # malice -- it is defending against someone reasonably thinking "the map
  # is generated, just commit it" and removing a round trip that exists so
  # ownership changes get seen by a person.
  BRANCH: automated/code-owners-refresh
  PROTECTED_BRANCHES: 'master main'

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Bot token so the push and PR authenticate as the bot, matching
          # how doc-gardening-nightly does it.
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          # Full history: the whole point is measuring a year of commits.
          # A shallow clone yields an almost-empty map and no error.
          fetch-depth: 0

      - name: Regenerate the map
        run: python3 scripts/code_owners.py --write --out "${MAP_PATH}"

      - name: Open a PR if it changed
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- "${MAP_PATH}"; then
            echo "Ownership unchanged; nothing to do."
            exit 0
          fi

          # Summarise the change for the PR body. A 126 KiB JSON diff is
          # unreadable line by line, so state which packages changed hands
          # -- that is the part a human can actually review.
          python3 - "${MAP_PATH}" > /tmp/summary.md <<'PY'
          import json, subprocess, sys
          path = sys.argv[1]
          old = json.loads(subprocess.run(
              ["git", "show", f"HEAD:{path}"],
              capture_output=True, text=True).stdout or "{}")
          new = json.loads(open(path).read())

          def top(d):
              return next(iter(d), None) if d else None

          moved = []
          for repo, cur in new.get("repos", {}).items():
              prev = old.get("repos", {}).get(repo, {})
              for pkg, counts in cur.get("packages", {}).items():
                  was = top(prev.get("packages", {}).get(pkg, {}))
                  now = top(counts)
                  if was and now and was != now:
                      moved.append(f"- `{repo}/{pkg}`: {was} -> {now}")

          print("Nightly refresh of the issue-triage ownership map.\n")
          if moved:
              print("Packages whose top author changed:\n")
              print("\n".join(sorted(moved)))
          else:
              print("No package changed its top author; only counts moved.")
          print("\nGenerated by `scripts/code_owners.py`. Do not hand-edit "
                "the map -- correct the script or the author table.")
          PY

          for protected in ${PROTECTED_BRANCHES}; do
            if [ "${BRANCH}" = "${protected}" ]; then
              echo "::error::Refusing to push to ${protected}. This job" \
                   "opens a PR; it never writes to a protected branch."
              exit 1
            fi
          done

          git config user.name  "darepo-doc-bot"
          git config user.email "bot@lightning.engineering"
          git checkout -B "${BRANCH}"
          git add "${MAP_PATH}"
          git commit -m "ci: Refresh the code-ownership map"

          # --force-with-lease, and only ever onto this job's own branch:
          # each night rewrites the same proposal rather than stacking a
          # new branch per run. The lease still refuses if someone else
          # has pushed to it since, so a human's edits on top are safe.
          git push --force-with-lease origin "${BRANCH}"

          # Reuse the open PR if there is one, so a week of quiet nights
          # does not leave a week of stale PRs behind.
          if [ -z "$(gh pr list --head "${BRANCH}" --state open \
                       --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "${BRANCH}" \
              --title "ci: Refresh the code-ownership map" \
              --body-file /tmp/summary.md
          else
            gh pr edit --head "${BRANCH}" --body-file /tmp/summary.md
          fi

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}
        run: |
          echo "::warning::Code-owners refresh failed. The issue-assign " \
               "workflow keeps using the last committed map, which ages " \
               "quietly rather than breaking."
