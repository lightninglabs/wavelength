name: Mobile Bindings

# The mobile binding package compiles on every relevant PR (a fast, host-tagged
# build plus an Android arm64 link check). The gomobile .aar / .xcframework
# release builds cross-compile the whole daemon for every ABI and run on
# tag pushes or manual recovery of an existing tag. Two tag namespaces drive
# the heavy build:
# a `mobile-v*` tag for a mobile-only cut (artifacts only), and a `v*` release
# tag, which additionally attaches the built `.aar`, `.xcframework`, and
# browser WASM runtime archive to the GitHub release for that tag (see the
# `publish` job).
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild (for example v0.2.0-rc1)
        required: true
        type: string
  push:
    tags:
      - "mobile-v*"
      # Anchored to a digit so only real release tags (v0.1.0, v1.2.3-rc1)
      # trigger the heavy build and the release-creating publish job, not any
      # stray `v`-prefixed tag (e.g. `vendor-x`).
      - "v[0-9]*"
  pull_request:
    paths:
      - "sdk/wavewalletdk/**"
      - "sdk/swaps/**"
      - "db/**"
      - "swapwallet/**"
      - "go.mod"
      - "go.sum"
      - "Makefile"
      - "scripts/wasm-wallet/**"
      - ".github/workflows/mobile-bindings.yml"
  merge_group:

permissions:
  contents: read

concurrency:
  group: mobile-${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # If you change this please also update GO_VERSION in Makefile.
  GO_VERSION: 1.26.9
  MOBILE_TAGS: "mobile wavewalletrpc swapruntime"

jobs:
  # Resolve the requested tag once so all artifacts use the same source SHA.
  release-source:
    name: Resolve release source
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.source.outputs.tag }}
      sha: ${{ steps.source.outputs.sha }}
      go-version: ${{ steps.source.outputs.go-version }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.release_tag && format('refs/tags/{0}', inputs.release_tag) || github.ref }}

      - name: Resolve release tag and toolchain
        id: source
        env:
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^(mobile-)?v[0-9][A-Za-z0-9.+-]*$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          go_version=$(awk '$1 == "GO_VERSION" && $2 == ":=" {print $3}' Makefile)
          [[ "$go_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "go-version=$go_version" >> "$GITHUB_OUTPUT"
          echo "Building $TAG at $sha with Go $go_version"

  ########################################################################
  # Fast gate: the facade must compile and its boundary tests must pass.
  # Runs on PRs and the merge queue, not on tag builds.
  ########################################################################
  unit:
    name: Compile + test (${{ matrix.sqlite }})
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Preserve the existing host check name for branch protection.
          - sqlite: host
            tags: ""
          - sqlite: Android SQLite
            tags: sqlite_cgo
    steps:
      - name: Git checkout
        uses: actions/checkout@v5

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Test WASM asset staging
        if: matrix.sqlite == 'host'
        run: go test ./scripts/wasm-wallet

      - name: Test mobile facade and SQLite stores
        env:
          SQLITE_TAGS: ${{ matrix.tags }}
          CGO_ENABLED: "1"
        run: |
          go test -timeout=10m -tags="${MOBILE_TAGS} ${SQLITE_TAGS}" \
            ./db/... ./sdk/swaps/... ./sdk/wavewalletdk/mobile/...

  android-compile:
    name: Link Android arm64
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - name: Link the mobile facade with Android SQLite
        env:
          NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: '1'
        run: |
          export CC="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          go test -c -tags="${MOBILE_TAGS} sqlite_cgo" \
            -ldflags="-extldflags '-Wl,-z,max-page-size=16384'" \
            -o "$RUNNER_TEMP/mobile-android-arm64.test" \
            ./sdk/wavewalletdk/mobile

  ########################################################################
  # Android .aar — tag builds only (mobile-v* or v*).
  ########################################################################
  android:
    name: Build Android .aar
    needs: release-source
    runs-on: ubuntu-latest
    steps:
      # The .aar cross-compiles the whole embedded daemon (btcwallet /
      # neutrino / lnd) for all four Android ABIs, and its Go build cache plus
      # the ~160MB output exhausts the default ubuntu-latest disk ("No space
      # left on device"). Reclaim space by deleting large preinstalled
      # toolchains we don't use, keeping the Android SDK/NDK that
      # setup-android relies on.
      - name: Free up runner disk space
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force || true
          echo "after:"; df -h /

      - name: Git checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-source.outputs.sha }}

      - name: Setup Go ${{ needs.release-source.outputs.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.release-source.outputs.go-version }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build .aar
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          gomobile init
          make mobile-android

      - name: Upload .aar
        uses: actions/upload-artifact@v4
        with:
          name: Wavewalletdk-aar
          path: sdk/wavewalletdk/mobile/build/android/Wavewalletdk.aar
          if-no-files-found: error

  ########################################################################
  # iOS .xcframework — tag builds only, mobile-v* or v* (macOS for Xcode).
  ########################################################################
  ios:
    name: Build iOS .xcframework
    needs: release-source
    runs-on: macos-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-source.outputs.sha }}

      - name: Setup Go ${{ needs.release-source.outputs.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.release-source.outputs.go-version }}

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build .xcframework
        run: |
          gomobile init
          make mobile-ios

      - name: Package .xcframework
        run: |
          tar -czf Wavewalletdk.xcframework.tar.gz \
            -C sdk/wavewalletdk/mobile/build/ios Wavewalletdk.xcframework

      - name: Upload .xcframework
        uses: actions/upload-artifact@v4
        with:
          name: Wavewalletdk-xcframework
          path: Wavewalletdk.xcframework.tar.gz
          if-no-files-found: error

  ########################################################################
  # Browser WASM runtime — tag builds only (mobile-v* or v*).
  ########################################################################
  wasm:
    name: Build browser WASM runtime
    needs: release-source
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.release-source.outputs.sha }}

      - name: Setup Go ${{ needs.release-source.outputs.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.release-source.outputs.go-version }}

      - name: Build browser WASM runtime
        run: |
          # Older tags resolve the SQLite directory while parsing Makefile.
          # Download it first so recovery needs no changes to tagged source.
          go mod download github.com/lightninglabs/go-wasmsqlite
          make wasm-wallet

      - name: Package browser WASM runtime
        run: |
          tar -czf Wavewalletdk.wasm.tar.gz -C bin/wasm \
            wavewalletdk.wasm \
            wavewalletdk.wasm.gz \
            wasm_exec.js \
            sqlite-bridge.js \
            sqlite-worker.js \
            sqlite-node-vfs.js \
            sqlite3.js \
            sqlite3.wasm \
            sqlite3-opfs-async-proxy.js

      - name: Upload browser WASM runtime
        uses: actions/upload-artifact@v4
        with:
          name: Wavewalletdk-wasm
          path: Wavewalletdk.wasm.tar.gz
          if-no-files-found: error

  ########################################################################
  # Attach the built bindings and WASM runtime to the GitHub release — v*
  # tags only.
  #
  # A `mobile-v*` tag stops at the artifact uploads above; only a real
  # release tag (`v*`) publishes the bindings as release assets so that
  # wavelength-sdk (packages/react-native/scripts/fetch-bindings.sh) can
  # download a stable set instead of building from a sibling checkout. The
  # browser WASM archive is also attached for release distribution; the web
  # consumer continues to use the separately hosted bucket populated by
  # `make wasm-publish`.
  ########################################################################
  publish:
    name: Attach bindings to release
    if: startsWith(needs.release-source.outputs.tag, 'v')
    needs: [release-source, android, ios, wasm]
    runs-on: ubuntu-latest
    concurrency:
      group: release-refs/tags/${{ needs.release-source.outputs.tag }}
      cancel-in-progress: false
    permissions:
      # Publishing release assets requires write access to repository
      # contents; the rest of this workflow only needs read.
      contents: write
    steps:
      - name: Download .aar
        uses: actions/download-artifact@v4
        with:
          name: Wavewalletdk-aar
          path: dist

      - name: Download .xcframework
        uses: actions/download-artifact@v4
        with:
          name: Wavewalletdk-xcframework
          path: dist

      - name: Download browser WASM runtime
        uses: actions/download-artifact@v4
        with:
          name: Wavewalletdk-wasm
          path: dist

      - name: Publish bindings to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-source.outputs.tag }}
        run: |
          set -euo pipefail

          # Release candidates must not be flagged as the latest stable
          # release.
          prerelease=""
          case "$TAG" in
            *-rc*) prerelease="--prerelease" ;;
          esac

          # Create a draft release on first publish for this tag. The release
          # build workflow uploads the waved/wavecli archives and manifest to
          # this same draft. Either workflow may win the race, so this creates
          # only when absent and the upload below clobbers existing assets.
          # --verify-tag refuses to invent a release for a missing tag.
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                --draft --title "$TAG" --verify-tag $prerelease \
                --notes "Provisional draft created by CI to attach the Android, iOS, and browser WASM bindings. The release build workflow attaches the reproducible \`waved\`/\`wavecli\` archives and manifest; maintainers add signatures and publish the release (see docs/release.md)."; then
              # The release workflow may have created the draft between our
              # view and create calls. Only tolerate failure if it exists now.
              gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
            fi
          fi

          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            dist/Wavewalletdk.aar \
            dist/Wavewalletdk.xcframework.tar.gz \
            dist/Wavewalletdk.wasm.tar.gz
